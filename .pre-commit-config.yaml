# Pre-commit hooks for the Python reference implementation.
# Runs black and isort on any Python source before committing.
repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
